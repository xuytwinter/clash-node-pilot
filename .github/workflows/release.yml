name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          architecture: x64

      - name: Validate versions
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid tag format: $tag" }
          $version = $tag.Substring(1)
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $version) { throw "package.json version $($package.version) does not match tag $tag" }

      - name: Test and syntax check
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test failed' }
          node --check server.js
          if ($LASTEXITCODE -ne 0) { throw 'server.js syntax check failed' }
          node --check public/app.js
          if ($LASTEXITCODE -ne 0) { throw 'public/app.js syntax check failed' }
          $scripts = Get-ChildItem -Path . -Filter *.ps1
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell parse failed for $($script.Name): $($errors[0].Message)" }
          }

      - name: Build portable package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\release.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'Portable package build failed' }

      - name: Verify packaged API and benchmark behavior
        shell: pwsh
        run: |
          node scripts/smoke-package.js
          if ($LASTEXITCODE -ne 0) { throw 'Portable API and benchmark smoke failed' }

      - name: Verify package contents
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $zip = "outputs\clash-node-pilot-v$version-windows-x64-portable.zip"
          $sha = "$zip.sha256"
          if (-not (Test-Path $zip)) { throw "Missing zip: $zip" }
          if (-not (Test-Path $sha)) { throw "Missing sha256: $sha" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $entries = $archive.Entries.FullName -replace '/', '\'
            foreach ($required in @(
              "clash-node-pilot-v$version-windows-x64\runtime\node.exe",
              "clash-node-pilot-v$version-windows-x64\runtime\NODE-LICENSE",
              "clash-node-pilot-v$version-windows-x64\runtime\NODE-RUNTIME.txt",
              "clash-node-pilot-v$version-windows-x64\server.js",
              "clash-node-pilot-v$version-windows-x64\BUILD-INFO.json",
              "clash-node-pilot-v$version-windows-x64\windows-common.ps1",
              "clash-node-pilot-v$version-windows-x64\start-pilot.ps1",
              "clash-node-pilot-v$version-windows-x64\public\index.html",
              "clash-node-pilot-v$version-windows-x64\regions.json"
            )) {
              if ($entries -notcontains $required) { throw "Missing package entry: $required" }
            }
            foreach ($forbidden in @('.git\', '\test\', '\work\', '\data\', '\node_modules\', '.log', '.zip')) {
              $bad = $entries | Where-Object { $_.Contains($forbidden) }
              if ($bad) { throw "Forbidden package entry: $($bad[0])" }
            }
          } finally {
            $archive.Dispose()
          }
          $expected = (Get-Content $sha).Split(' ')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Portable zip checksum mismatch' }

      - name: Isolated portable smoke test
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $zip = Resolve-Path "outputs\clash-node-pilot-v$version-windows-x64-portable.zip"
          $smokeRoot = Join-Path $env:RUNNER_TEMP ('clash pilot smoke path with spaces ' + [guid]::NewGuid().ToString('N'))
          Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $smokeRoot -Force
          $app = Join-Path $smokeRoot "clash-node-pilot-v$version-windows-x64"
          $port = Get-Random -Minimum 40000 -Maximum 55000
          $isolation = Join-Path $env:RUNNER_TEMP 'clash-pilot-isolated-profile'
          New-Item -ItemType Directory -Path $isolation -Force | Out-Null
          $env:PORT = "$port"
          $env:APPDATA = Join-Path $isolation 'Roaming'
          $env:LOCALAPPDATA = Join-Path $isolation 'Local'
          $env:USERPROFILE = Join-Path $isolation 'User'
          $env:HOME = Join-Path $isolation 'Home'
          $env:CLASH_PILOT_STATE = Join-Path $isolation 'state.json'
          $env:CLASH_PILOT_DISABLE_AUTO_LOOP = '1'
          $env:CLASH_PILOT_DISABLE_OS_INTEGRATION = '1'
          $env:CLASH_PILOT_DEMO = '1'
          $process = Start-Process -FilePath (Join-Path $app 'runtime\node.exe') -ArgumentList @('server.js') -WorkingDirectory $app -WindowStyle Hidden -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                if ($health.ok -and $health.version -eq $version) { break }
              } catch {}
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            if (-not $health.ok -or $health.version -ne $version -or [int]$health.port -ne $port) { throw 'Isolated /api/health smoke test failed' }
            $homeResponse = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
            if ($homeResponse.StatusCode -ne 200) { throw 'Static page smoke test failed' }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Obtain pinned previous installer for upgrade acceptance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/previous -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/xuytwinter/clash-node-pilot/releases/download/v0.3.0/clash-node-pilot-v0.3.0-windows-x64-setup.exe' -OutFile work/previous/setup.exe
          if ((Get-FileHash work/previous/setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fc301269f3eabbcc54e2f2c2423c8652cecdbc26854e9ccf5f0c7aaf359efdb6') { throw 'Previous installer checksum mismatch' }

      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -ExpectedSourceSha '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-installer.ps1 -SetupPath "outputs/clash-node-pilot-v$version-windows-x64-setup.exe" -PreviousSetupPath work/previous/setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer acceptance failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-installer.ps1 -SetupPath "outputs/clash-node-pilot-v$version-windows-x64-setup.exe" -VerifyIntegration
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer desktop integration failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            outputs/*.zip
            outputs/*.sha256
            outputs/*-setup.exe
            outputs/*-setup.exe.build.json

  macos:
    uses: ./.github/workflows/macos.yml

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release-assets'
          merge-multiple: true
          path: release-assets
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets
          version="${RELEASE_TAG#v}"
          for name in "windows-x64-portable.zip" "windows-x64-setup.exe" "macos-arm64.dmg" "macos-x64.dmg"; do
            test -s "clash-node-pilot-v$version-$name"
            test -s "clash-node-pilot-v$version-$name.sha256"
          done
          for name in windows-x64-setup.exe macos-arm64.dmg macos-x64.dmg; do
            test -s "clash-node-pilot-v$version-$name.build.json"
          done
          sha256sum --check *.sha256
          cd ..
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Clash Node Pilot $RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
