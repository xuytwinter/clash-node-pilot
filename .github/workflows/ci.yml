name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  node-core:
    name: Node core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Test shared core and server
        run: npm test

      - name: Syntax check JavaScript
        shell: pwsh
        run: |
          node --check server.js
          node --check public/app.js
          Get-ChildItem -Path src -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName }

  android-source:
    name: Android build and source guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Verify Android companion source layout
        shell: bash
        run: |
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/clashnodepilot/companion/PilotForegroundService.java
          test -f android/app/src/main/java/com/clashnodepilot/companion/PairingStore.java

      - name: Secret hygiene scan
        shell: bash
        run: |
          ! grep -RInE 'Bearer [A-Za-z0-9._-]{12,}|https?://[^ ]*(token|secret|subscribe|subscription)=' android src docs README.md SECURITY.md RELEASE_NOTES.md CHANGELOG.md

      - name: Build debug APK
        shell: bash
        run: gradle -p android :app:assembleDebug

      - name: Upload debug APK for device smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: clash-node-pilot-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  macos-preview-artifacts:
    name: macOS preview artifacts
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build macOS portable previews
        shell: bash
        run: bash ./release-macos.sh

      - name: Verify macOS preview contents
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for ARCH in arm64 x64; do
            ZIP="outputs/clash-node-pilot-v$VERSION-darwin-$ARCH-portable.zip"
            SHA="$ZIP.sha256"
            test -f "$ZIP"
            test -f "$SHA"
            EXPECTED="$(awk '{print $1}' "$SHA")"
            ACTUAL="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
            test "$EXPECTED" = "$ACTUAL"
            TMP="$(mktemp -d)"
            unzip -q "$ZIP" -d "$TMP"
            test -x "$TMP/clash-node-pilot-v$VERSION-darwin-$ARCH/runtime/node"
            test -x "$TMP/clash-node-pilot-v$VERSION-darwin-$ARCH/start-clash-node-pilot.command"
          done

      - name: Smoke test packaged macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          MACHINE="$(uname -m)"
          if [[ "$MACHINE" == "arm64" ]]; then
            ARCH="arm64"
          else
            ARCH="x64"
          fi

          ZIP="outputs/clash-node-pilot-v$VERSION-darwin-$ARCH-portable.zip"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          APP="$TMP/clash-node-pilot-v$VERSION-darwin-$ARCH"
          PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          ISO="$(mktemp -d)"
          LOG="$ISO/node-pilot.log"
          export PORT
          export APPDATA="$ISO/Roaming"
          export LOCALAPPDATA="$ISO/Local"
          export USERPROFILE="$ISO/User"
          export HOME="$ISO/Home"
          export CLASH_PILOT_STATE="$ISO/state.json"
          export CLASH_PILOT_DISABLE_AUTO_LOOP="1"

          "$APP/start-clash-node-pilot.command" >"$LOG" 2>&1 &
          PID="$!"
          cleanup() {
            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for _ in {1..40}; do
            if curl -fsS "http://127.0.0.1:$PORT/api/health" | tee "$ISO/health.json"; then
              node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('$ISO/health.json','utf8')); if(!h.ok || h.version !== '$VERSION') process.exit(1);"
              exit 0
            fi
            sleep 0.5
          done

          echo "Packaged macOS runtime did not become healthy" >&2
          cat "$LOG" >&2 || true
          exit 1

      - name: Upload macOS previews for external testing
        uses: actions/upload-artifact@v4
        with:
          name: clash-node-pilot-macos-preview-zips
          path: |
            outputs/*darwin-*.zip
            outputs/*darwin-*.zip.sha256
          if-no-files-found: error
