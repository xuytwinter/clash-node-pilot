name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  node-core:
    name: Node core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Test shared core and server
        run: npm test

      - name: Syntax check JavaScript
        shell: pwsh
        run: |
          node --check server.js
          node --check public/app.js
          Get-ChildItem -Path src -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName }

  android-source:
    name: Android build and source guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Verify Android companion source layout
        shell: bash
        run: |
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/clashnodepilot/companion/PilotForegroundService.java
          test -f android/app/src/main/java/com/clashnodepilot/companion/PairingStore.java

      - name: Secret hygiene scan
        shell: bash
        run: |
          ! grep -RInE 'Bearer [A-Za-z0-9._-]{12,}|https?://[^ ]*(token|secret|subscribe|subscription)=' android src docs README.md SECURITY.md RELEASE_NOTES.md CHANGELOG.md

      - name: Build debug APK
        shell: bash
        run: gradle -p android :app:assembleDebug

      - name: Upload debug APK for device smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: clash-node-pilot-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
