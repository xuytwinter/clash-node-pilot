<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clash Node Pilot</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">C</span><div><strong data-i18n="brandTitle">Node Pilot</strong><span data-i18n="brandSub">Local Mihomo control</span></div></div>
    <div class="header-actions"><button id="langButton" class="help-button" type="button">中文</button><button id="startupButton" class="startup-button" type="button" data-i18n="startup">Startup</button><a class="help-button" href="/guide.html" title="Open docs" aria-label="Open docs" data-i18n="docs">Docs</a><div id="connection" class="connection"><span></span><span data-i18n="connecting">Connecting</span></div></div>
  </header>
  <main>
    <section class="summary">
      <div><p class="eyebrow" data-i18n="currentExit">Current Exit</p><h1 id="activeNode">Loading...</h1><p id="activeGroup" class="muted">Reading Mihomo controller</p></div>
      <button id="refreshButton" class="icon-button" title="Refresh status" aria-label="Refresh status">↻</button>
    </section>

    <section class="workspace">
      <div class="controls">
        <div class="control-heading"><label for="backendSelect" data-i18n="proxyClient">Proxy Client</label><button id="settingsButton" class="settings-button" type="button"><span aria-hidden="true">⚙</span><span data-i18n="settings">Settings</span></button></div>
        <select id="backendSelect"></select>
        <p id="clientInfo" class="automation-status"></p>
        <div id="demoScenarioRow" class="demo-scenario" hidden>
          <label for="demoScenarioSelect" data-i18n="demoScenario">Demo Scenario</label>
          <select id="demoScenarioSelect"></select>
        </div>
        <label for="groupSelect" data-i18n="selectorGroup">Selector Group</label>
        <select id="groupSelect"></select>
        <label data-i18n="targetRegion">Target Region</label>
        <div id="regions" class="regions" role="radiogroup"></div>
        <div class="settings-row">
          <label class="check"><input id="autoSwitch" type="checkbox" checked><span data-i18n="switchAfterTest">Switch after test</span></label>
        </div>
        <div class="settings-row">
          <label class="check"><input id="monitorOnly" type="checkbox"><span data-i18n="monitorOnly">Monitor only</span></label>
          <button id="lockButton" class="text-button" type="button">Lock 15 min</button>
        </div>
        <dialog id="settingsDialog" class="settings-dialog">
          <div class="dialog-heading"><div><p class="eyebrow" data-i18n="nodePilot">Node Pilot</p><h2 data-i18n="settingsTitle">Optimization Settings</h2></div><button id="closeSettings" class="icon-button" type="button" aria-label="Close settings">×</button></div>
          <div class="dialog-fields">
            <label for="autoInterval" data-i18n="autoInterval">Auto interval (min)</label><input id="autoInterval" type="number" min="1" max="60" step="1">
            <label for="testUrl" data-i18n="manualTestUrl">Manual probe URL</label><input id="testUrl" type="url">
            <label for="timeout" data-i18n="manualTimeout">Manual timeout (ms)</label><input id="timeout" type="number" min="1000" max="10000" step="500">
            <label for="switchThreshold" data-i18n="switchThreshold">Switch threshold (score ms)</label><input id="switchThreshold" type="number" min="0" max="500" step="5">
            <label for="switchCooldown" data-i18n="switchCooldown">Switch cooldown (min)</label><input id="switchCooldown" type="number" min="0" max="1440" step="1">
            <label for="healthHalfLife" data-i18n="healthHalfLife">Health half-life (min)</label><input id="healthHalfLife" type="number" min="1" max="10080" step="1">
            <label for="samples" data-i18n="samples">Samples per node</label><input id="samples" type="number" min="1" max="5">
            <label for="pauseMinutes" data-i18n="manualPause">Manual protection (min)</label><input id="pauseMinutes" type="number" min="1" max="1440">
            <label for="connectivityInterval" data-i18n="connectivityInterval">Connectivity interval (min)</label><input id="connectivityInterval" type="number" min="1" max="30">
            <label for="connectivityTimeout" data-i18n="connectivityTimeout">Connectivity timeout (ms)</label><input id="connectivityTimeout" type="number" min="1000" max="10000" step="500">
          </div>
          <p id="settingsError" class="dialog-error" role="alert"></p>
          <div class="dialog-actions"><button id="cancelSettings" class="secondary" type="button" data-i18n="cancel">Cancel</button><button id="saveSettings" class="primary compact" type="button" data-i18n="saveSettings">Save Settings</button></div>
        </dialog>
        <button id="optimizeButton" class="primary" disabled><span class="bolt">⚡</span><span data-i18n="runTest">Test and Select</span></button>
        <button id="cancelJobButton" class="secondary full" type="button" hidden>Cancel Current Job</button>
        <p id="message" class="message" aria-live="polite"></p>
        <p id="automationStatus" class="automation-status">Loading automation status...</p>
      </div>

      <div class="results-panel">
        <div class="panel-heading"><div><p class="eyebrow" data-i18n="latestRun">Latest Run</p><h2 data-i18n="ranking">Node Ranking</h2></div><span id="resultCount" class="count">No run yet</span></div>
        <div id="decisionPanel" class="decision-panel" hidden>
          <div><strong id="decisionTitle"></strong><span id="decisionMeta"></span></div>
          <dl id="decisionDetails"></dl>
        </div>
        <div id="trendHeading" class="trend-heading" hidden>Recent Latency Trend</div>
        <div id="trend" class="trend" aria-label="Recent latency trend"></div>
        <div id="empty" class="empty"><div class="signal">⌁</div><strong data-i18n="emptyTitle">No measurements yet</strong><span data-i18n="emptySub">Choose a region and run a test to rank nodes</span></div>
        <div id="results" class="results"></div>
      </div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
